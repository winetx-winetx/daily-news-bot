name: Daily News Push

on:
  schedule:
    # 每 30 分钟执行一次
    - cron: '*/30 * * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  push-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run news push
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          # 注意这里：等号左边是代码要用的变量名，右边是你 GitHub 里实际配置的 Secret 名字
          FEISHU_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
          TOPICS: "融资,风险投资,创业融资,VC投资,创投"
        run: |
          python scripts/news_bot.py --once --topics "融资,风险投资,创业融资,VC投资,创投"
